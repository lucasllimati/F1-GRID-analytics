# Ciclo da redação em produção: coleta as fontes, agrupa pautas e (com IA configurada) redige e checa.
# Roda aqui, e não na Vercel, porque um ciclo com IA pode passar dos 5 minutos que a Vercel permite
# por função no plano gratuito. O progresso aparece no banner do /admin, pois é gravado no banco.
#
# Agenda (horário de Brasília = UTC−3; o GitHub só aceita UTC e o Brasil não tem horário de verão
# desde 2019 — se voltar a ter, ajuste os horários abaixo):
#   • Seg–sex, 8h às 19h ............ de hora em hora (horário comercial)
#   • Sexta, 20h às 23h ............. de hora em hora (treinos nas Américas)
#   • Sábado e domingo, 6h às 23h ... de hora em hora (fim de semana de corrida)
#   • Sáb. e dom., 0h e 3h .......... corridas na Ásia/Oceania durante a madrugada
# ≈ 104 execuções/semana ≈ 1.350 min/mês do limite gratuito (2.000 min/mês em repositório privado).
# Minuto 17 para fugir do pico de agendamentos na hora cheia; o GitHub pode atrasar alguns minutos.
name: Ciclo de notícias

on:
  schedule:
    - cron: "17 11-22 * * 1-5" #  seg–sex 08h–19h (Brasília)
    - cron: "17 23 * * 5" #        sexta 20h
    - cron: "17 0-2 * * 6,0,1" #   sex/sáb/dom 21h–23h (em UTC já é o dia seguinte)
    - cron: "17 9-23 * * 6,0" #    sábado e domingo 06h–20h
    - cron: "17 3,6 * * 6,0" #     sábado e domingo 00h e 03h
  workflow_dispatch:
    inputs:
      ingest_only:
        description: "Só buscar manchetes (sem IA)"
        type: boolean
        default: false

permissions:
  contents: read

# Nunca dois ciclos ao mesmo tempo (o banco também tem trava própria).
concurrency:
  group: news-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Não roda em forks nem antes de o banco de produção estar configurado.
    if: ${{ github.repository_owner == 'lucasllimati' }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Cadeia de reserva (opcional): outros provedores com plano gratuito, cada um com a sua chave.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NEWS_AI_FALLBACKS: ${{ vars.NEWS_AI_FALLBACKS }}
      NEWS_AI_PROVIDER: ${{ vars.NEWS_AI_PROVIDER || 'gemini' }}
      NEWS_AI_MODEL: ${{ vars.NEWS_AI_MODEL }}
      NEWS_PUBLISH_MODE: ${{ vars.NEWS_PUBLISH_MODE || 'semi' }}
      NEWS_MAX_ARTICLES_PER_RUN: ${{ vars.NEWS_MAX_ARTICLES_PER_RUN || '2' }}
      NEWS_MAX_ARTICLES_PER_DAY: ${{ vars.NEWS_MAX_ARTICLES_PER_DAY || '24' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://example.com' }}
      NEWS_TRIGGER: cron
      LOG_LEVEL: info
    steps:
      - name: Verificar segredo do banco
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::Secret DATABASE_URL não configurado — veja docs/DEPLOY.md. Ciclo ignorado."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != '1'

      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        if: env.SKIP != '1'
        run: npm ci

      - name: Cliente do banco (PostgreSQL)
        if: env.SKIP != '1'
        run: npm run db:pg:generate

      - name: Rodar ciclo
        if: env.SKIP != '1'
        run: |
          if [ "${{ inputs.ingest_only }}" = "true" ]; then npm run news:ingest; else npm run news:cycle; fi
